name: Despliegue Automático en Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Compilar y Desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Tests de Seguridad Cívica
        run: npm run test:redteam

      - name: Compilar Bundle Producción (Vite)
        run: npm run build

      - name: Desplegar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMOCRACIA_VIVA_ES }}'
          channelId: live
          projectId: democracia-viva-es
