name: Despliegue Automático en Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Compilar y Desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Tests de Seguridad Cívica
        run: npm run test:redteam

      - name: Compilar Bundle Producción (Vite)
        run: npm run build

      - name: Desplegar en Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMOCRACIA_VIVA_ES || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_ADMIN_SDK }}
        run: node scripts/deploy-ci.js



