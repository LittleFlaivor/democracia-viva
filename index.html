<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Democracia Viva | Decisiones Cívicas Verificables</title>
  <meta name="description" content="Plataforma interactiva de democracia líquida y voto criptográfico verificable. Toma las riendas del Real Decreto-ley de Vivienda con fricción cero y consenso cívico.">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Democracia Viva">
  <meta name="application-name" content="Democracia Viva">

  <!-- Manifest PWA Oficial -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Favicon Oficial extraído del Isotipo de Marca -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/pwa-192.png">

  <link rel="canonical" href="https://democraciaviva.es/">

  <!-- Open Graph / Redes Sociales (WhatsApp, Telegram, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://democraciaviva.es/">
  <meta property="og:title" content="Democracia Viva | Decisiones Cívicas Verificables">
  <meta property="og:description" content="Plataforma interactiva de democracia líquida y voto criptográfico verificable sobre el Real Decreto-ley de Vivienda.">
  <meta property="og:image" content="https://democraciaviva.es/og-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Democracia Viva | Decisiones Cívicas Verificables">
  <meta name="twitter:description" content="Toma las riendas del Real Decreto-ley de Vivienda con fricción cero, consenso cívico y recibos criptográficos verificables.">
  <meta name="twitter:image" content="https://democraciaviva.es/og-preview.png">

  <!-- Tipografía Moderna Geométrica Estilo Product Sans (Outfit + Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos del Sistema de Diseño -->
  <link rel="stylesheet" href="./src/ui/styles/tokens.css">
  <link rel="stylesheet" href="./src/ui/styles/typography.css">
  <link rel="stylesheet" href="./src/ui/styles/layout.css">
  <link rel="stylesheet" href="./src/ui/styles/components.css">
  <link rel="stylesheet" href="./src/ui/styles/voting-ui.css">
</head>
<body class="gamified-body">
  <!-- Fondo Dinámico con Movimiento Orgánico Flotante (Paleta Limpia de 3 Colores Armoniosos) -->
  <div class="ambient-mesh-background" id="ambient-mesh" aria-hidden="true">
    <div class="ambient-orb-layer" id="layer-1"><div class="ambient-orb orb-1"></div></div>
    <div class="ambient-orb-layer" id="layer-2"><div class="ambient-orb orb-2"></div></div>
    <div class="ambient-orb-layer" id="layer-3"><div class="ambient-orb orb-3"></div></div>
  </div>


  <!-- 1. Dock Discreto de Perfiles y Selector de Tema (Esquina Superior) -->
  <header id="profile-dock-container"></header>

  <!-- 2. Escenario Principal del Juego -->
  <main class="game-viewport">
    <!-- Barómetros HUD Flotantes Superiores -->
    <section id="hud-barometers-container" aria-label="Barómetros de Impacto en Vivo"></section>

    <!-- Mazo 3D Central de Cartas / Pantalla Eureka -->
    <section id="game-stage-container" aria-label="Mazo Central Cívico"></section>
  </main>

  <!-- 3. Pie de Página Institucional y Versión de la Aplicación -->
  <footer id="civic-footer-container" class="civic-footer"></footer>

  <!-- Contenedor del Banner Flotante PWA (No Invasivo) -->
  <div id="pwa-banner-root" class="pwa-banner-container"></div>

  <!-- Contenedor de Modales (Novela Gráfica, BOE, Acta y Recibo ZK) -->
  <div id="modal-root-container"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
